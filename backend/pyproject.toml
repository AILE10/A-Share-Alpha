[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-alpha-studio"
version = "0.1.0"
description = "A-Share Alpha Studio: Personal A-Share Quant Research, Walk-Forward Backtest, Paper Trading & Compliant Execution System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "duckdb>=1.1.3",
    "pandas>=2.2.3",
    "numpy>=1.26.4,<2.3",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.2",
    "lightgbm>=4.5.0",
    "akshare>=1.15.0",
    "baostock>=0.8.9",
    "apscheduler>=3.10.4",
    "httpx>=0.27.2",
    "websockets>=13.1",
    "python-dotenv>=1.0.1",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
]
tushare = [
    "tushare>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short"
