services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: alpha-studio-backend
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - DUCKDB_PATH=/app/data/market_analytics.duckdb
      - SQLITE_PATH=/app/data/studio_state.db
      - MODELS_DIR=/app/data/models
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: alpha-studio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
